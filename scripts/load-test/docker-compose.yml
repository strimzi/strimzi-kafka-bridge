# Load-test environment: single-node Kafka (KRaft) with four listeners and a
# Keycloak OIDC provider.
#
#   docker compose up -d
#   tear down (add -v to drop the Kafka data too):
#   docker compose down
#
#   the PKI material for the SSL listener is generated by
#   ./certs/generate-certs.sh (mounted into the broker container)
#
# Listeners:
#   PLAINTEXT  localhost:9092 - no authentication (baseline scenarios)
#   SASL       localhost:9095 - SASL PLAINTEXT with static users (basic auth scenarios)
#   SSL        localhost:9096 - TLS with required client certificates (mTLS scenarios)
#   OAUTH      localhost:9094 - SASL PLAINTEXT with OAUTHBEARER, validated against
#              the Keycloak JWKS endpoint (OAuth scenarios; validated by the Strimzi
#              OAuth broker-side handler bundled in the Strimzi Kafka image)
#
# Keycloak is exposed on localhost:8180 and advertises itself with that address,
# so that the OIDC discovery document resolves to host-reachable endpoints (the
# bridge-side discovery-based validation).
services:
  kafka:
    image: quay.io/strimzi/kafka:0.51.0-kafka-4.2.0
    container_name: loadtest-kafka
    # the GC log default location ($KAFKA_HOME/logs) is not writable by the
    # "kafka" user of the image: redirect it (and the application logs) to /tmp
    environment:
      KAFKA_GC_LOG_OPTS: "-Xlog:gc*:file=/tmp/kafka-gc.log:time"
      LOG_DIR: /tmp/kafka-logs
    command:
      - sh
      - -c
      - |
        mkdir -p /opt/kafka/logs /var/lib/kafka/data
        # the OAUTH listener fetches the JWKS keys from the OIDC provider at
        # startup: wait for the provider (HTTP) to be ready
        until (echo > /dev/tcp/keycloak/8080) 2>/dev/null; do
          echo "Waiting for the OIDC provider..."
          sleep 2
        done
        test -f /var/lib/kafka/data/meta.properties || \
        /opt/kafka/bin/kafka-storage.sh format -t q1W2e3R4t5Y6u7I8o9P0aA -c /opt/kafka/config/loadtest.properties --ignore-formatted
        exec /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/loadtest.properties
    ports:
      - "9092:9092"
      - "9094:9094"
      - "9095:9095"
      - "9096:9096"
    volumes:
      - ./kafka/server.properties:/opt/kafka/config/loadtest.properties:ro,Z
      - ./certs/generated:/opt/kafka/config/certs:ro,Z
      - kafka-data:/var/lib/kafka/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: loadtest-keycloak
    # always started: the OAUTH listener of the Kafka broker fetches the JWKS
    # keys from the provider at startup
    command:
      - start-dev
      - --import-realm
      # fixed hostname, so that the token issuer (iss claim) is stable and the
      # advertised endpoints (discovery document) are reachable from the host
      # running the bridge and the load generator
      - --hostname=http://localhost:8180
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-loadtest.json:/opt/keycloak/data/import/realm-loadtest.json:ro,Z

volumes:
  kafka-data:
