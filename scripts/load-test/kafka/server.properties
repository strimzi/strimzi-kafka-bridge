# Single-node Kafka (KRaft) for the HTTP bridge load tests.
#
# PLAINTEXT listener: no authentication (baseline scenarios)
# SASL listener: SASL PLAINTEXT with PLAIN static users (basic auth scenarios)
# SSL listener: TLS with required client certificates (mTLS scenarios)
# OAUTH listener: SASL PLAINTEXT with OAUTHBEARER, validated against the Keycloak
# JWKS endpoint via the Strimzi OAuth handlers bundled in the Strimzi Kafka image
# (the issuer and the JWKS URI use the in-network "keycloak" hostname)

process.roles=broker,controller
node.id=0
controller.quorum.voters=0@kafka:9093
controller.listener.names=CONTROLLER

listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,OAUTH:SASL_PLAINTEXT,SASL:SASL_PLAINTEXT,SSL:SSL
listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,OAUTH://0.0.0.0:9094,SASL://0.0.0.0:9095,SSL://0.0.0.0:9096
advertised.listeners=PLAINTEXT://localhost:9092,OAUTH://localhost:9094,SASL://localhost:9095,SSL://localhost:9096
inter.broker.listener.name=PLAINTEXT

# SASL/PLAIN listener (basic auth scenarios: the HTTP Basic credentials are passed
# through to the broker as SASL/PLAIN credentials; the loadtest-user-N pool backs
# the USERS knob of the k6 scripts - USERS above the pool size wraps around)
listener.name.sasl.sasl.enabled.mechanisms=PLAIN
listener.name.sasl.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required \
    user_kafka-broker="kafka-broker-secret" \
    user_loadtest-user-1="loadtest-password" \
    user_loadtest-user-2="loadtest-password" \
    user_loadtest-user-3="loadtest-password" \
    user_loadtest-user-4="loadtest-password" \
    user_loadtest-user-5="loadtest-password" \
    user_loadtest-user-6="loadtest-password" \
    user_loadtest-user-7="loadtest-password" \
    user_loadtest-user-8="loadtest-password" \
    user_loadtest-user-9="loadtest-password" \
    user_loadtest-user-10="loadtest-password";

# SSL listener (mTLS scenarios: only clients with a certificate of the local CA,
# mounted from ../certs/generated, are accepted)
listener.name.ssl.ssl.client.auth=required
listener.name.ssl.ssl.keystore.location=/opt/kafka/config/certs/kafka.keystore.p12
listener.name.ssl.ssl.keystore.type=PKCS12
listener.name.ssl.ssl.keystore.password=certs-password
listener.name.ssl.ssl.key.password=certs-password
listener.name.ssl.ssl.truststore.location=/opt/kafka/config/certs/kafka.truststore.p12
listener.name.ssl.ssl.truststore.type=PKCS12
listener.name.ssl.ssl.truststore.password=certs-password

# OAUTH listener (broker-side token validation with the Strimzi OAuth handlers)
listener.name.oauth.sasl.enabled.mechanisms=OAUTHBEARER
listener.name.oauth.oauthbearer.sasl.server.callback.handler.class=io.strimzi.kafka.oauth.server.JaasServerOauthValidatorCallbackHandler
listener.name.oauth.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required \
    oauth.jwks.endpoint.uri="http://keycloak:8080/realms/loadtest/protocol/openid-connect/certs" \
    oauth.valid.issuer.uri="http://localhost:8180/realms/loadtest" \
    oauth.username.claim="preferred_username" \
    oauth.jwks.refresh.seconds="60" \
    oauth.token.endpoint.uri="http://keycloak:8080/realms/loadtest/protocol/openid-connect/token" \
    oauth.client.id="kafka-broker" \
    oauth.client.secret="kafka-broker-secret";
listener.name.oauth.oauthbearer.sasl.login.callback.handler.class=io.strimzi.kafka.oauth.client.JaasClientOauthLoginCallbackHandler

# load-test friendly defaults: small log files, fast metadata propagation
log.dirs=/var/lib/kafka/data
num.partitions=3
default.replication.factor=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
auto.create.topics.enable=true
group.initial.rebalance.delay.ms=0
