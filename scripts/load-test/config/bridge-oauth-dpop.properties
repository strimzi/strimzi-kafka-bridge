# OAuth bridge configuration for the load tests: DPoP sender-constrained tokens.
#
# The HTTP clients present a DPoP proof (RFC 9449) with each request, signed with
# the client private key (generated by certs/generate-certs.sh): the bridge
# validates the proof and, when the access token carries a cnf.jkt confirmation
# claim, binds it to the proof key. The tokens are validated against the JWKS
# endpoint (required by the DPoP validation) and passed through to the Kafka
# cluster (OAUTH listener, localhost:9094).
#
# Note: the Kafka broker cannot verify DPoP proofs (SASL/OAUTHBEARER has no DPoP
# support), the sender-constraining is enforced at the bridge API surface only.
#
# Run: kafka_bridge_run.sh --config-file scripts/load-test/config/bridge-oauth-dpop.properties

bridge.id=loadtest-bridge

kafka.bootstrap.servers=localhost:9094
kafka.security.protocol=SASL_PLAINTEXT
kafka.sasl.mechanism=OAUTHBEARER

authentication.type=oauth
authentication.mode=passthrough
authentication.username.claim=preferred_username

# bridge-side token validation via the JWKS endpoint (required by the DPoP
# sender-constrained tokens)
authentication.token.validation=jwks
authentication.jwks.endpoint.uri=http://localhost:8180/realms/loadtest/protocol/openid-connect/certs
authentication.valid.issuer.uri=http://localhost:8180/realms/loadtest

# DPoP sender-constrained tokens
authentication.dpop=true

# Optional: refresh the credentials pinned by the consumers on subsequent requests
# (recreates a consumer whose creation-time token expired with a valid token of the
# same principal, preserving the subscription; see the design doc for the trade-offs).
# Enable it for long-running consume scenarios with tokens shorter than the session:
# authentication.consumer.credentials.refresh=true

bridge.metrics=strimziMetricsReporter
