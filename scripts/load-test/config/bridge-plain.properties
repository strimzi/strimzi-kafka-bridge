# Baseline bridge configuration for the load tests: no authentication,
# Kafka reached via the PLAINTEXT listener (localhost:9092).
#
# Run: java -jar target/kafka-bridge-<version>.jar --config-file scripts/load-test/config/bridge-plain.properties

bridge.id=loadtest-bridge

# Kafka cluster (PLAINTEXT listener)
kafka.bootstrap.servers=localhost:9092

# HTTP endpoint (the /metrics endpoint is always exposed on the same port)
http.host=0.0.0.0
http.port=8080

# Executor offloading the blocking Kafka calls (the classic first bottleneck):
# defaults to max(4, <available CPUs> * 2) threads with a queue of 1,000
#bridge.executor.pool.size=8
#bridge.executor.queue.size=1000

# Kafka client metrics (producer/consumer/admin) exposed on /metrics
bridge.metrics=strimziMetricsReporter

# Producer tuning for the throughput scenarios (uncomment and vary one at a time)
#kafka.linger.ms=0
#kafka.batch.size=16384
#kafka.acks=1
