# mTLS bridge configuration for the load tests: HTTPS with required client
# certificates.
#
# The HTTP clients authenticate with a TLS client certificate (CN=loadtest-user,
# generated by certs/generate-certs.sh): the bridge validates the certificate
# against the local CA and the subject against the allowed patterns, and passes
# the certificate through to the Kafka cluster (SSL listener with required client
# authentication, localhost:9096), using its own certificate as the TLS client
# certificate.
#
# Run: kafka_bridge_run.sh --config-file scripts/load-test/config/bridge-mtls.properties
#
# Load (k6, with the client certificate; the TLS API listens on 8443):
#   TLS_CLIENT_CERT=scripts/load-test/certs/generated/loadtest-client-cert.pem \
#   TLS_CLIENT_KEY=scripts/load-test/certs/generated/loadtest-client-key.pem \
#   BASE_URL=https://localhost:8443 \
#   k6 run scripts/load-test/k6/produce.js

bridge.id=loadtest-bridge

# Kafka cluster over TLS with the bridge certificate as the client certificate
kafka.bootstrap.servers=localhost:9096
kafka.security.protocol=SSL
kafka.ssl.truststore.location=scripts/load-test/certs/generated/kafka.truststore.p12
kafka.ssl.truststore.type=PKCS12
kafka.ssl.truststore.password=certs-password
kafka.ssl.keystore.location=scripts/load-test/certs/generated/bridge.keystore.p12
kafka.ssl.keystore.type=PKCS12
kafka.ssl.keystore.password=certs-password
kafka.ssl.key.password=certs-password

# bridge HTTPS listener with mTLS: the client certificates are validated against
# the local CA and their subject must match the allowed patterns
http.ssl.enable=true
http.ssl.certificate.location=scripts/load-test/certs/generated/bridge-cert.pem
http.ssl.key.location=scripts/load-test/certs/generated/bridge-key.pem
http.ssl.client-auth=required
http.ssl.trusted.certificates.location=scripts/load-test/certs/generated/ca-cert.pem

# only certificates with an allowed subject are accepted
authentication.type=client-cert
authentication.allowed.subjects=CN=loadtest-user

bridge.metrics=strimziMetricsReporter
