# OAuth bridge configuration for the load tests: no bridge-side token validation.
#
# The tokens provided by the HTTP clients are forwarded as-is to the Kafka cluster
# (OAUTH listener, localhost:9094): the token validation happens broker-side only
# (Strimzi OAuth handlers). Measures the passthrough path without the bridge-side
# validation cost.
#
# Run: kafka_bridge_run.sh --config-file scripts/load-test/config/bridge-oauth-none.properties

bridge.id=loadtest-bridge

kafka.bootstrap.servers=localhost:9094
kafka.security.protocol=SASL_PLAINTEXT
kafka.sasl.mechanism=OAUTHBEARER

authentication.type=oauth
authentication.mode=passthrough
authentication.username.claim=preferred_username

# no bridge-side validation: only the broker-side validation on the OAUTH listener
authentication.token.validation=none

bridge.metrics=strimziMetricsReporter
