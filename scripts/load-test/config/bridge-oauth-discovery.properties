# OAuth bridge configuration for the load tests: endpoints resolved from the OIDC
# discovery document.
#
# Instead of the direct JWKS/introspection endpoint URIs, only the discovery
# document URI is configured: the bridge resolves (and caches) the endpoints from
# the provider's .well-known/openid-configuration document. Measures the discovery
# resolution (one extra provider call at startup, per the metric
# strimzi.bridge.auth.last.success{endpoint="discovery"}).
#
# Requires the Keycloak advertised hostname to be host-reachable
# (docker-compose.yml: --hostname=http://localhost:8180).
#
# Run: kafka_bridge_run.sh --config-file scripts/load-test/config/bridge-oauth-discovery.properties

bridge.id=loadtest-bridge

kafka.bootstrap.servers=localhost:9094
kafka.security.protocol=SASL_PLAINTEXT
kafka.sasl.mechanism=OAUTHBEARER

authentication.type=oauth
authentication.mode=passthrough
authentication.username.claim=preferred_username

# bridge-side token validation via the endpoints of the discovery document
authentication.token.validation=introspection
authentication.discovery.uri=http://localhost:8180/realms/loadtest/.well-known/openid-configuration
authentication.client.id=kafka-broker
authentication.client.secret=kafka-broker-secret
authentication.introspection.cache.seconds=30

bridge.metrics=strimziMetricsReporter
