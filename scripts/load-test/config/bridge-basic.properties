# Basic authentication bridge configuration for the load tests.
#
# The HTTP clients authenticate with the Basic scheme (Authorization: Basic
# base64(user:password)): the credentials are passed through to the Kafka cluster
# (SASL/PLAIN listener, localhost:9095) as SASL/PLAIN credentials. There is no
# OIDC provider involvement: the broker validates the static users of the SASL/PLAIN
# listener (user_kafka-broker=kafka-broker-secret in kafka/server.properties).
#
# Run: kafka_bridge_run.sh --config-file scripts/load-test/config/bridge-basic.properties
#
# Load (k6, with AUTH_SCHEME=basic):
#   k6 run -e AUTH_SCHEME=basic scripts/load-test/k6/auth-passthrough.js

bridge.id=loadtest-bridge

kafka.bootstrap.servers=localhost:9095
kafka.security.protocol=SASL_PLAINTEXT
kafka.sasl.mechanism=PLAIN

authentication.type=basic

bridge.metrics=strimziMetricsReporter
