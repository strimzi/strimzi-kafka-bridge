# OAuth bridge configuration for the load tests: the tokens provided by the HTTP
# clients are validated by the bridge (introspection endpoint of the Keycloak OIDC
# provider) and then passed through to the Kafka cluster (OAUTH listener, localhost:9094).
#
# Prerequisites: docker compose up -d (Keycloak on localhost:8180)
#
# Run: java -jar target/kafka-bridge-<version>.jar --config-file scripts/load-test/config/bridge-oauth.properties

bridge.id=loadtest-bridge

# Kafka cluster (OAUTH listener: the tokens are passed through to Kafka)
kafka.bootstrap.servers=localhost:9094
kafka.security.protocol=SASL_PLAINTEXT
kafka.sasl.mechanism=OAUTHBEARER

# OIDC access token authentication (passthrough mode) with bridge-side validation
authentication.type=oauth
authentication.mode=passthrough
authentication.username.claim=preferred_username

# bridge-side token validation: introspection (with the introspection cache)
authentication.token.validation=introspection
authentication.introspection.endpoint.uri=http://localhost:8180/realms/loadtest/protocol/openid-connect/token/introspect
authentication.client.id=kafka-broker
authentication.client.secret=kafka-broker-secret
authentication.introspection.cache.seconds=30

# --- variants (replace the introspection block above, one variable at a time) ---
#
# bridge-side validation via the JWKS endpoint (signature check only, no provider call
# per token):
#authentication.token.validation=jwks
#authentication.jwks.endpoint.uri=http://localhost:8180/realms/loadtest/protocol/openid-connect/certs
#
# no bridge-side validation (only the broker-side validation on the OAUTH listener):
#authentication.token.validation=none
#
# disable the introspection cache (every request hits the provider: measures the
# provider latency floor of the validation path):
#authentication.introspection.cache.seconds=0

# executor offloading the blocking Kafka calls
#bridge.executor.pool.size=8
#bridge.executor.queue.size=1000

# Kafka client metrics (producer/consumer/admin) exposed on /metrics
bridge.metrics=strimziMetricsReporter
