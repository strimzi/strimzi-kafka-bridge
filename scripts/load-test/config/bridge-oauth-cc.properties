# OAuth bridge configuration for the load tests: bridge-side client credentials.
#
# The bridge obtains its OWN access tokens from the provider (client credentials
# grant) and uses them for the Kafka cluster (OAUTH listener, localhost:9094).
# The HTTP clients need NO authentication at all: the Authorization header of the
# requests is ignored. Measures the HTTP + producer path when the per-request
# client authentication is absent (only the bridge's single shared token is
# validated broker-side, refreshed before expiry).
#
# Run: kafka_bridge_run.sh --config-file scripts/load-test/config/bridge-oauth-cc.properties
#
# Load with the plain scenarios (no Authorization header):
#   k6 run scripts/load-test/k6/produce.js

bridge.id=loadtest-bridge

kafka.bootstrap.servers=localhost:9094
kafka.security.protocol=SASL_PLAINTEXT
kafka.sasl.mechanism=OAUTHBEARER

authentication.type=oauth
# the bridge obtains its own tokens
authentication.mode=client-credentials
authentication.username.claim=preferred_username
authentication.token.endpoint.uri=http://localhost:8180/realms/loadtest/protocol/openid-connect/token
authentication.client.id=kafka-broker
authentication.client.secret=kafka-broker-secret

bridge.metrics=strimziMetricsReporter
