# OAuth bridge configuration for the load tests: JWKS (signature-only) validation.
#
# The tokens provided by the HTTP clients are validated against the JWKS endpoint
# of the Keycloak OIDC provider (signature check, no provider call per request)
# and then passed through to the Kafka cluster (OAUTH listener, localhost:9094).
#
# Run: kafka_bridge_run.sh --config-file scripts/load-test/config/bridge-oauth-jwks.properties

bridge.id=loadtest-bridge

kafka.bootstrap.servers=localhost:9094
kafka.security.protocol=SASL_PLAINTEXT
kafka.sasl.mechanism=OAUTHBEARER

authentication.type=oauth
authentication.mode=passthrough
authentication.username.claim=preferred_username

# bridge-side token validation via the JWKS endpoint (signature check only)
authentication.token.validation=jwks
authentication.jwks.endpoint.uri=http://localhost:8180/realms/loadtest/protocol/openid-connect/certs
authentication.valid.issuer.uri=http://localhost:8180/realms/loadtest

# Optional: refresh the credentials pinned by the consumers on subsequent requests
# (recreates a consumer whose creation-time token expired with a valid token of the
# same principal, preserving the subscription; see the design doc for the trade-offs).
# Enable it for long-running consume scenarios with tokens shorter than the session:
# authentication.consumer.credentials.refresh=true

bridge.metrics=strimziMetricsReporter
