# Bridge-related settings
bridge.id=my-bridge

# uncomment the following line if you want to specify the executor pool size, otherwise it defaults to max(4, <available CPUs> * 2)
#bridge.executor.pool.size=10
# uncomment the following line if you want to specify the executor queue size, otherwise it defaults to 1000
#bridge.executor.queue.size=1000

# uncomment the following line to enable Prometheus JMX Exporter, check the Kafka Bridge documentation for more details
#bridge.metrics=jmxPrometheusExporter
# optionally, set the file path of your custom configuration
#bridge.metrics.exporter.config.path=/path/to/my-exporter-config.yaml

# uncomment the following line to enable Strimzi Metrics Reporter, check the Kafka Bridge documentation for more details
#bridge.metrics=strimziMetricsReporter
# optionally, filter the exposed metrics of all internal Kafka clients using a comma separated list of regexes
#kafka.prometheus.metrics.reporter.allowlist=.*

# uncomment the following line (bridge.tracing) to enable OpenTelemetry tracing, check the documentation for more details
#bridge.tracing=opentelemetry

# uncomment the following lines to enable OIDC access token authentication, check the documentation for more details
# the tokens are used for authenticating the internal Kafka clients against the Kafka cluster
# (requires an OAUTHBEARER listener on the Kafka cluster, e.g. kafka.security.protocol=SASL_SSL and kafka.sasl.mechanism=OAUTHBEARER)
#
# passthrough mode (default): tokens provided by HTTP clients in the Authorization header are passed through
#authentication.type=oauth
#authentication.mode=passthrough
# optionally, set the JWT claim used to map the token to the Kafka principal ("sub" by default)
#authentication.username.claim=sub
#
# optionally, enable the bridge-side validation of the tokens before forwarding them ("none" by default):
# "jwks" (signature-only, against the JWKS endpoint of the OIDC provider) or "introspection" (RFC 7662)
#authentication.token.validation=jwks
#authentication.jwks.endpoint.uri=https://my-sso/protocol/openid-connect/certs
#
# optionally, enable the DPoP (RFC 9449) sender-constrained tokens: the DPoP proof in the DPoP header
# of the HTTP clients is validated and bound to the access token (requires the token validation)
#authentication.dpop=true
#
# optionally, refresh the credentials pinned by the consumers on subsequent requests: when the token
# provided at consumer creation is expired, a valid token of the same principal on a subsequent request
# recreates the consumer preserving its subscription (requires the token validation)
#authentication.consumer.credentials.refresh=true
#
# client-credentials mode: the bridge obtains and refreshes the tokens itself using the client credentials grant
#authentication.type=oauth
#authentication.mode=client-credentials
#authentication.token.endpoint.uri=https://my-sso/oauth2/token
#authentication.client.id=my-client
#authentication.client.secret=my-secret
# alternatively, provide the client secret from a file
#authentication.client.secret.location=/etc/secrets/client-secret
#
# HTTP Basic authentication: credentials provided by HTTP clients in the Authorization header (Basic scheme)
# are passed through for authenticating the internal Kafka clients against the Kafka cluster
# (requires a SASL PLAIN or SCRAM listener on the Kafka cluster, e.g. kafka.security.protocol=SASL_SSL and kafka.sasl.mechanism=SCRAM-SHA-512)
#authentication.type=basic
# optionally, set the SASL mechanism (PLAIN, SCRAM-SHA-256 or SCRAM-SHA-512);
# if not set, the kafka.sasl.mechanism above is used, defaulting to PLAIN
#authentication.sasl.mechanism=PLAIN

# Apache Kafka common
kafka.bootstrap.servers=localhost:9092

# Apache Kafka producer
kafka.producer.acks=1

# Apache Kafka consumer
kafka.consumer.auto.offset.reset=earliest

# HTTP-related settings
http.host=0.0.0.0
http.port=8080
# Enable CORS
http.cors.enabled=false
http.cors.allowedOrigins=*
http.cors.allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH

# Enable consumer
http.consumer.enabled=true

# Enable producer
http.producer.enabled=true

# HTTP management interface
http.management.port=8081
