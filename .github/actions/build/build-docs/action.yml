name: "Build Documentation"
description: "Builds Strimzi Bridge documentation in HTML and PDF formats"

inputs:
  artifactName:
    description: "Name of the documentation artifact to upload"
    required: false
    default: "documentation.tar"
  runnerArch:
    description: "Runner architecture (amd64, arm64)"
    required: false
    default: "amd64"

runs:
  using: "composite"
  steps:
    - name: Install yq
      uses: strimzi/github-actions/.github/actions/dependencies/install-yq@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
      with:
        architecture: ${{ inputs.runnerArch }}

    - name: Set up Ruby
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        ruby-version: '3.2'
        
    - name: Install asciidoctor
      shell: bash
      run: |
        gem install asciidoctor
        gem install asciidoctor-pdf
        
    - name: Build documentation
      shell: bash
      run: make docu_html docu_htmlnoheader
      
    - name: Create documentation archive
      shell: bash
      run: tar -cvpf documentation.tar ./documentation/html ./documentation/htmlnoheader
      
    - name: Upload documentation artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifactName }}
        path: documentation.tar