name: Build

on:
  push:
    branches:
      - "main"
      - "release-*"
  pull_request:
    branches:
      - "*"

# Declare default permissions as read only
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kafka-bridge:
    name: Build Kafka Bridge
    strategy:
      matrix:
        # Java 21 is used as default version
        # In case of adding new version make sure that build-containers and deploy-java has correct static version set
        java:
          - version: "21"
            mainBuild: true
          - version: "25"
            mainBuild: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java and Maven
        uses: strimzi/github-actions/.github/actions/dependencies/setup-java@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          javaVersion: ${{ matrix.java.version }}

      - name: Build binaries using build-binaries action
        uses: strimzi/github-actions/.github/actions/build/build-binaries@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          mainJavaBuild: ${{ matrix.java.mainBuild }}
          artifactSuffix: "kafka-bridge"

  build-docs:
    name: Build docs
    needs:
      - build-kafka-bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build/build-docs
        with:
          artifactName: "documentation.tar"
          runnerArch: "amd64"

  build-containers:
    name: Build Containers
    needs:
      - build-kafka-bridge
    strategy:
      matrix:
        architecture:
          - amd64
          - arm64
          - s390x
          - ppc64le
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: strimzi/github-actions/.github/actions/dependencies/install-docker@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0

      - uses: strimzi/github-actions/.github/actions/build/build-containers@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          architecture: ${{ matrix.architecture }}
          artifactSuffix: "kafka-bridge"
          containerRegistry: "quay.io"
          containerOrg: "strimzi"
          containerTag: "latest"
          imagesLocation: "kafka-bridge-${{ matrix.architecture }}.tar.gz"

  push-containers:
    name: Push Containers
    needs:
      - build-kafka-bridge
      - build-containers
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.push-containers.outputs.images }}
      sbomsArtifact: ${{ steps.push-containers.outputs.sbomsArtifact }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: strimzi/github-actions/.github/actions/dependencies/install-docker@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0

      - uses: strimzi/github-actions/.github/actions/dependencies/install-syft@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          version: "1.57.1"

      - id: push-containers
        uses: strimzi/github-actions/.github/actions/build/push-containers@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          architectures: "amd64,arm64,ppc64le,s390x"
          containerRegistry: "quay.io"
          containerOrg: "strimzi"
          containerTag: "latest"
          registryUser: ${{ secrets.QUAY_USER }}
          registryPassword: ${{ secrets.QUAY_PASS }}
          artifactSuffix: "kafka-bridge"

  attest:
    name: Attestation
    needs:
      - push-containers
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: strimzi/github-actions/.github/workflows/reusable-attest.yml@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
    with:
      containerImages: ${{ needs.push-containers.outputs.images }}
      sbomsArtifact: ${{ needs.push-containers.outputs.sbomsArtifact }}

  publish-docs:
    name: Publish Docs
    needs:
      - build-kafka-bridge
      - build-containers
      - build-docs
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build/publish-docs
        with:
          artifactName: "documentation.tar"
          websiteDeployKey: ${{ secrets.WEBSITE_DEPLOY_KEY }}

  deploy-java:
    name: Deploy Java artifacts
    needs:
      - build-kafka-bridge
      - build-containers
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: strimzi/github-actions/.github/actions/dependencies/setup-java@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          javaVersion: "21"

      - uses: strimzi/github-actions/.github/actions/build/deploy-java@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          gpgPassphrase: ${{ secrets.GPG_PASSPHRASE }}
          gpgSigningKey: ${{ secrets.GPG_SIGNING_KEY }}
          centralUsername: ${{ secrets.CENTRAL_USERNAME }}
          centralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          artifactSuffix: "kafka-bridge"
          modules: "./"

  # Publishes the binaries archive used for the container image builds to GHCR as an OCI artifact
  # on every push to main. It is tagged with the project version (from release.version).
  publish-snapshot:
    name: Publish snapshot to GHCR
    needs:
      - build-kafka-bridge
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ORAS
        uses: strimzi/github-actions/.github/actions/dependencies/install-oras@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          version: "1.3.6"

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-kafka-bridge.tar

      - name: Get project version
        id: version
        run: echo "version=$(cat release.version)" >> "$GITHUB_OUTPUT"

      - name: Push binaries to GHCR
        id: push
        uses: strimzi/github-actions/.github/actions/build/push-oci-artifact@bb4758d4afacd9c0ff8f426395bbbece41fd142a # v4.0
        with:
          file: binaries-kafka-bridge.tar
          name: binaries-kafka-bridge
          tag: ${{ steps.version.outputs.version }}
          mediaType: application/x-tar
