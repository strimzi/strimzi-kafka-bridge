name: FOSSA Scanning

on:
  # Run after build workflow finishes in non-blocking way
  workflow_run:
    workflows: ["Build"]
    types:
      - completed
    branches:
      - main
  # Allow to run it also as reusable workflow from releases
  workflow_call:
    inputs:
      releaseVersion:
        description: 'Release version for FOSSA branch reference'
        required: false
        type: string
        default: ''
      sourceBuildRunId:
        description: 'Build workflow run ID for artifact download'
        required: true
        type: string
    secrets:
      FOSSA_API_KEY:
        required: true

# Declare default permissions as read only
permissions:
  contents: read

# Cancel previous scans on the same branch
concurrency:
  group: fossa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fossa-maven-scan:
    name: FOSSA Maven Scan
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java and Maven
        uses: strimzi/github-actions/.github/actions/dependencies/setup-java@52b17c19f3687e37b47c9c64696b96f28f53625b # v2.3
        with:
          javaVersion: "21"

      - name: Build Java code
        run: mvn -B -DskipTests -Dmaven.javadoc.skip=true clean install

      - name: Run FOSSA Maven scan
        uses: strimzi/github-actions/.github/actions/security/fossa-maven-scan@52b17c19f3687e37b47c9c64696b96f28f53625b # v2.3
        with:
          scanName: kafka-bridge
          fossaTest: "true"
          branch: ${{ inputs.releaseVersion || github.ref_name }}

  fossa-container-scan:
    name: FOSSA Container Scan
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
    steps:
      - name: Download container archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: containers-kafka-bridge-amd64.tar
          run-id: ${{ inputs.sourceBuildRunId || github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Untar container archive
        run: tar -xvf containers-kafka-bridge-amd64.tar

      - name: Install Docker
        uses: strimzi/github-actions/.github/actions/dependencies/install-docker@52b17c19f3687e37b47c9c64696b96f28f53625b # v2.3

      - name: Run FOSSA container scan
        uses: strimzi/github-actions/.github/actions/security/fossa-container-scan@52b17c19f3687e37b47c9c64696b96f28f53625b # v2.3
        with:
          imageFile: kafka-bridge-amd64.tar.gz
          image: kafka-bridge
          scanName: "kafka-bridge-container"
          fossaTest: "true"
          branch: ${{ inputs.releaseVersion || github.ref_name }}
